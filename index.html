<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>GameBox</title><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&display=swap" rel="stylesheet">
<style>
:root{--a:hsl(118 75% 45%);--a2:hsl(118 80% 62%);--sw:150px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;user-select:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
#bg{position:fixed;inset:0;overflow:hidden}
.bl{position:absolute;inset:-8%;background-size:cover;background-position:center;opacity:0;transition:opacity .7s;filter:blur(38px) saturate(1.3) brightness(.65)}
.bl.on{opacity:1}
body.pm .bl{filter:brightness(.6)}body.pm .bl,body.pl .bl{transition-duration:.3s}
#shade{position:fixed;inset:0;background:radial-gradient(110% 80% at 50% 25%,#0000 25%,#000b),linear-gradient(#0000 45%,#000e)}
#top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;z-index:5}
#av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-weight:700;transition:transform .35s cubic-bezier(.3,1.9,.5,1)}
#av:hover{transform:scale(1.15) rotate(-8deg)}
#nm{font-weight:600;font-size:14px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav{flex:1;display:flex;gap:4px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tb{padding:8px 15px;border-radius:99px;font-size:14px;color:#cfd6dd;transition:background .25s,color .25s,transform .3s cubic-bezier(.3,1.9,.5,1);white-space:nowrap}
.tb:hover{background:#fff2;transform:translateY(-2px)}.tb.on{background:#fff;color:#000;font-weight:600}
#q{width:150px;padding:8px 14px;border-radius:99px;border:1px solid #fff3;background:#0006;outline:0;font-size:14px;transition:width .35s,border-color .25s}
#q:focus{width:230px;border-color:var(--a)}
#clk{font-weight:600;min-width:52px;text-align:right}
#gear{width:34px;height:34px;border-radius:50%;font-size:17px;transition:background .25s,transform .5s}#gear:hover{background:#fff2;transform:rotate(90deg)}
#stage{position:fixed;left:0;right:0;top:calc(50% - 150px);height:270px;z-index:2;touch-action:pan-y;cursor:grab}
.t{position:absolute;left:0;top:70px;width:var(--sw);height:var(--sw);border-radius:6px;background-size:cover;transform-origin:0 100%;will-change:transform;box-shadow:0 12px 30px #0009}
.t.f{box-shadow:0 0 0 3px #0b0d10,0 0 0 6px var(--a),0 0 40px -4px var(--a)}
.t .n{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;font-size:11px;font-weight:600;background:linear-gradient(#0000,#000c);opacity:0;transition:opacity .25s;border-radius:0 0 6px 6px}
.t.f .n{opacity:1}
.ac{position:absolute;top:5px;right:5px;display:none;gap:4px}.t.f .ac{display:flex}
.ac button{width:24px;height:24px;border-radius:50%;background:#000a;font-size:12px;transition:transform .25s cubic-bezier(.3,1.9,.5,1)}.ac button:hover{transform:scale(1.25);background:var(--a)}
#info{position:fixed;left:96px;top:calc(50% + 138px);z-index:2;pointer-events:none}
#ttl{font-size:26px;font-weight:700;text-shadow:0 2px 12px #000a}#sub{color:#b8c0c9;font-size:13px;margin-top:2px}
#empty{position:fixed;left:0;right:0;top:50%;text-align:center;color:#9aa3ad;display:none;z-index:2}
#dock{position:fixed;left:96px;bottom:30px;display:flex;gap:12px;z-index:3}
.d{width:190px;height:96px;border-radius:6px;background:#0c1f2ecc;backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:space-between;padding:12px;text-align:left;font-size:14px;font-weight:600;transition:transform .4s cubic-bezier(.3,1.8,.5,1),box-shadow .25s}
.d b{font-size:24px;font-weight:400}.d:hover{transform:scale(1.07) rotate(-.6deg);box-shadow:0 0 0 3px var(--a)}.d.pl2{background:linear-gradient(135deg,var(--a),#000a)}
#scrim{position:fixed;inset:0;z-index:29;background:#0008;opacity:0;pointer-events:none;transition:opacity .35s}#scrim.on{opacity:1;pointer-events:auto}
#edge{position:fixed;left:0;top:0;bottom:0;width:8px;z-index:28}
#side{position:fixed;left:0;top:0;bottom:0;width:360px;max-width:92vw;z-index:30;transform:translateX(-104%);transition:transform .5s cubic-bezier(.2,.9,.2,1);background:linear-gradient(90deg,#0b0f14f5,#0b0f14e6);backdrop-filter:blur(26px);padding:24px 18px;overflow:auto;border-right:1px solid #fff1}
#side.on{transform:none}body.pl #side{transition:none}
#side h2{margin:4px 8px 16px;font-size:22px}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:12px;text-align:left;font-size:16px;transition:background .2s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.it:hover,.it.on{background:#fff1;transform:translateX(5px)}
.it i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#0006);font-style:normal;flex:none}
.sec{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}.sec.on{grid-template-rows:1fr}.sec>div{overflow:hidden}.in{padding:8px 8px 18px}
.seg{display:flex;background:#fff1;border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;transition:background .25s}.seg .on{background:var(--a);font-weight:600}
.hint{font-size:12px;color:#9aa3ad;margin:8px 2px 0;line-height:1.4}
#ww{position:relative;width:170px;height:170px;margin:4px auto 12px;touch-action:none}
#wheel{position:absolute;inset:0;border-radius:50%;cursor:pointer;background:conic-gradient(hsl(0 80% 50%),hsl(60 80% 50%),hsl(120 80% 50%),hsl(180 80% 50%),hsl(240 80% 50%),hsl(300 80% 50%),hsl(360 80% 50%));-webkit-mask:radial-gradient(circle,#0000 45px,#000 46px);mask:radial-gradient(circle,#0000 45px,#000 46px)}
#kn{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #000a;pointer-events:none}
#cp{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:var(--a);box-shadow:0 0 30px var(--a)}
.sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sws button{width:26px;height:26px;border-radius:50%;transition:transform .3s cubic-bezier(.3,1.9,.5,1)}.sws button:hover{transform:scale(1.3)}
.txt{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #fff3;background:#0006;outline:0}.txt:focus{border-color:var(--a)}
.row{display:flex;gap:8px;margin-bottom:10px}.row .txt{flex:1}
.mini{padding:9px 13px;border-radius:10px;background:var(--a);font-weight:600;font-size:13px}
.fr{display:flex;align-items:center;gap:4px;padding:6px 4px 6px 10px;border-radius:10px;background:#fff1;margin-bottom:6px;font-size:14px}.fr span{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr button{width:28px;height:28px;border-radius:8px}.fr button:hover{background:#fff2}
#pick{position:fixed;inset:0;z-index:40;background:#000a;display:none;place-items:center}
#pick .card{width:340px;max-width:92vw;max-height:80vh;overflow:auto;background:#12171d;border-radius:18px;padding:18px;border:1px solid #fff2;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
#pick h3{margin:0 0 12px;font-size:16px}@keyframes pop{from{transform:scale(.85);opacity:0}}
body.pl *{transition:none!important;animation:none!important}
#zoom{position:fixed;z-index:150;display:none;border-radius:6px;background-size:cover;pointer-events:none}
#fade{position:fixed;inset:0;z-index:200;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#player{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}#player.open{display:flex}
.ptop{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#10141a;border-bottom:1px solid #fff1}
.btn{padding:9px 14px;border-radius:99px;background:#fff1;font-size:14px;transition:background .2s}.btn:hover{background:var(--a)}
.ptitle{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstage{position:relative;flex:1;background:#000}#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#status{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;color:#9aa3ad;background:#0b0d13}#status.hide{display:none}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #2a2f42;border-top-color:var(--a);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#ff6b7a;font-weight:600}
@media(max-width:700px){#top{padding:0 12px;gap:8px}#nm,#clk{display:none}#q{width:100px}#info,#dock{left:24px}.d{width:130px}#edge{display:none}}

/* ===== Xbox home restyle + player fixes ===== */
:root{--pl:296px}
.bl{filter:blur(22px) saturate(1.25) brightness(.7)}
body:not(.pm):not(.pl) .bl.on{animation:dr 28s ease-in-out infinite alternate}@keyframes dr{to{transform:scale(1.1) translate(-2%,1.5%)}}
#info,#dock{left:var(--pl)}
.t{border-radius:4px}.t .n{border-radius:0 0 4px 4px}
.t.f{box-shadow:0 0 0 3px #0b0d10,0 0 0 6px #fff,0 24px 60px -8px #000;animation:br 2.4s ease-in-out infinite}
@keyframes br{50%{box-shadow:0 0 0 3px #0b0d10,0 0 0 6px #fff,0 0 36px 4px var(--a),0 24px 60px -8px #000}}
.t::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),#fff5,#fff0 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.t.f::after,.t:hover::after{opacity:1}
#rowt{position:fixed;left:var(--pl);top:calc(50% - 194px);z-index:2;display:flex;align-items:baseline;gap:10px;pointer-events:none}
#rowt b{font-size:20px;font-weight:600;text-shadow:0 2px 12px #000a}#rowt span{color:#9aa3ad;font-size:13px}
#rowt .oi{pointer-events:auto;display:flex;align-items:center;gap:6px;margin-left:8px;cursor:pointer;user-select:none;text-shadow:0 2px 10px #000a}
#rowt .oi input{accent-color:var(--a2);width:15px;height:15px;margin:0;cursor:pointer}#rowt .oi span{color:#cfd6dd}#rowt .oi small{color:#9aa3ad;font-size:12px}
.d{border-radius:4px;background:#161a20d9}.d:hover{box-shadow:0 0 0 3px #fff}
#cnt,#rec,#hints{display:none}
#toast{position:fixed;left:50%;bottom:28px;z-index:300;transform:translate(-50%,20px);padding:12px 18px;border-radius:8px;background:#161a20;border:1px solid #fff3;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#status{color:#fff}
.lt{width:120px;height:120px;border-radius:6px;background-size:cover;box-shadow:0 0 0 3px #fff,0 20px 50px #000a;animation:lp 1.6s ease-in-out infinite}@keyframes lp{50%{transform:scale(1.06)}}
.bar{position:relative;width:200px;height:3px;border-radius:2px;background:#ffffff1f;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--a);animation:sl 1.1s ease-in-out infinite}@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media(min-width:900px){
#edge{display:none}
#top{padding:0 28px 0 var(--pl)}
#av,#nm{position:fixed;left:22px;top:15px}#nm{left:66px;top:22px;max-width:150px}
#nav{position:fixed;left:0;top:0;bottom:0;width:256px;padding:78px 12px 250px;flex-direction:column;justify-content:flex-start;gap:2px;overflow:hidden auto;background:linear-gradient(#10141aee,#0b0e12f2);backdrop-filter:blur(20px);border-right:1px solid #ffffff14;z-index:-1}
#nav .tb{text-align:left;border-radius:6px;padding:12px 14px;font-size:15px;color:#d5dbe2}
#nav .tb:hover{background:#ffffff1a;transform:translateX(4px)}
#nav .tb.on{background:#ffffff26;color:#fff;font-weight:600;box-shadow:inset 3px 0 var(--a)}
#q{width:auto;flex:1;max-width:560px;margin-right:auto;padding:11px 18px;background:#14181ecc;border-color:#ffffff26}
#q:focus{width:auto;border-color:#fff;box-shadow:0 0 0 3px #fff3}
#cnt{display:block;margin-left:12px;padding:6px 12px;border-radius:99px;background:#ffffff1a;font-size:13px;font-weight:600}
#rec{display:block;position:fixed;left:12px;bottom:18px;width:232px;z-index:6}
#rec h4{margin:0 8px 6px;font-size:13px;color:#9aa3ad;font-weight:600}
.rc{display:flex;gap:10px;align-items:center;width:100%;padding:6px 8px;border-radius:6px;text-align:left;font-size:13px;transition:background .2s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.rc:hover{background:#ffffff1a;transform:translateX(4px)}
.rc i{width:38px;height:38px;border-radius:4px;background-size:cover;flex:none}.rc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hints{display:flex;position:fixed;right:28px;bottom:34px;z-index:3;gap:18px;font-size:13px;color:#b8c0c9}
#hints kbd{display:inline-grid;min-width:24px;height:24px;padding:0 6px;margin-right:5px;place-items:center;border-radius:6px;background:#ffffff26;color:#fff;font-size:12px;font-weight:600;font-family:inherit}
}

#warn{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;max-width:min(720px,calc(100vw - 24px));padding:8px 8px 8px 16px;border-radius:10px;background:#2a2108ee;border:1px solid #f5c54a88;color:#ffe3a3;font-size:13px;line-height:1.35;box-shadow:0 8px 28px #0008;backdrop-filter:blur(8px);transition:opacity .3s,transform .3s}
#warn.gone{opacity:0;transform:translate(-50%,-12px);pointer-events:none}
#warn button{flex:none;width:26px;height:26px;border:0;border-radius:6px;background:#ffffff1a;color:inherit;font-size:18px;line-height:1;cursor:pointer}#warn button:hover{background:#ffffff33}
.pre #warn{opacity:0}
@media(max-width:700px){#warn{font-size:12px;top:62px}}
/* ===== GameBox: font, logo, intro, entrance ===== */
html{font-synthesis:none}html,body,button,input{font-family:"ADLaM Display","Segoe UI",system-ui,sans-serif}
#av{width:40px;height:40px;background:url(logo.png) center/cover no-repeat;font-size:0;box-shadow:0 0 0 2px #fff3}
#intro{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(60% 55% at 50% 44%,#14803c,#0a4220 52%,#03170a);transition:opacity .9s ease,visibility 0s .9s}
#intro.out{opacity:0;visibility:hidden;pointer-events:none}
#il{width:min(34vmin,260px);height:auto;opacity:0;filter:blur(18px) brightness(.35) drop-shadow(0 0 0 #6dff9a00);transform:scale(.86)}
#iw{font-size:min(7vmin,52px);letter-spacing:.5em;margin-left:.5em;opacity:0;color:#eafff0;text-shadow:0 0 30px #3dff7a99}
#itap{position:absolute;bottom:9vh;font-size:15px;color:#bff5cd;opacity:0}#itap.on{animation:tp 1.6s ease-in-out infinite}@keyframes tp{0%,100%{opacity:.9}50%{opacity:.3}}
#intro.go #il{animation:il 5.2s cubic-bezier(.3,.6,.2,1) .3s forwards}
#intro.go #iw{animation:iw 3.6s ease-out 4.4s forwards}
@keyframes il{35%{opacity:.7}to{opacity:1;filter:blur(0) brightness(1) drop-shadow(0 0 60px #6dff9acc);transform:scale(1)}}
@keyframes iw{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1;letter-spacing:.5em;filter:blur(0)}}
body.pl #il,body.pl #iw{opacity:1!important;filter:none!important;transform:none!important}
#bg,#shade{transition:opacity 1.4s}.pre #bg,.pre #shade{opacity:0}
.pre .t,.pre #top>:not(#nav),.pre #nav .tb,.pre .d,.pre #rowt,.pre #info,.pre #hints,.pre .rc{opacity:0}
.pre #nav{translate:-110% 0}
.in .t,.in .t.f{animation:sp 1s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.5s + var(--k,0)*80ms)}
.in #av,.in #nm{animation:pp .9s cubic-bezier(.2,1.8,.4,1) .1s both}
.in #top>:not(#nav):not(#av):not(#nm){animation:fd .8s ease-out both;animation-delay:calc(1s + var(--k,1)*60ms)}
.in #nav{animation:sr .9s cubic-bezier(.2,1.1,.4,1) .15s both}
.in #nav .tb{animation:sl .7s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(.45s + var(--k,1)*70ms)}
.in #rowt,.in #info{animation:sp .9s cubic-bezier(.2,1.4,.4,1) .7s both}
.in .d{animation:pp .8s cubic-bezier(.2,1.8,.4,1) both;animation-delay:calc(1.1s + var(--k,1)*110ms)}
.in #hints,.in .rc{animation:fd .8s ease-out 1.7s both}
@keyframes sp{from{opacity:0;translate:0 44px;scale:.8}}@keyframes pp{from{opacity:0;scale:.3}}@keyframes fd{from{opacity:0;translate:0 -14px}}@keyframes sl{from{opacity:0;translate:-26px 0}}@keyframes sr{from{translate:-110% 0}}
#rowt,#info{--k:2}#hints{--k:6}
#nav .tb:nth-child(1){--k:1}#nav .tb:nth-child(2){--k:2}#nav .tb:nth-child(3){--k:3}#nav .tb:nth-child(4){--k:4}#nav .tb:nth-child(5){--k:5}#nav .tb:nth-child(6){--k:6}#nav .tb:nth-child(7){--k:7}#nav .tb:nth-child(8){--k:8}#nav .tb:nth-child(9){--k:9}#nav .tb:nth-child(10){--k:10}#nav .tb:nth-child(11){--k:11}#nav .tb:nth-child(12){--k:12}#top>:nth-child(1){--k:1}#top>:nth-child(2){--k:2}#top>:nth-child(3){--k:3}#top>:nth-child(4){--k:4}#top>:nth-child(5){--k:5}#top>:nth-child(6){--k:6}#top>:nth-child(7){--k:7}.d:nth-child(1){--k:4}.d:nth-child(2){--k:5}.d:nth-child(3){--k:6}.d:nth-child(4){--k:7}.rc:nth-child(2){--k:4}.rc:nth-child(3){--k:5}.rc:nth-child(4){--k:6}

/* intro v2 */
#intro{background:#000;transition:none;transform-origin:50% 46%}
#intro::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(60% 55% at 50% 44%,#14803c,#0a4220 52%,#03170a)}
#intro.go::before{animation:gf 2.4s ease-out both}@keyframes gf{from{opacity:0}to{opacity:1}}
#intro.go #il{animation:lz 6s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes lz{from{opacity:0;transform:scale(2.4);filter:blur(16px) brightness(.3) drop-shadow(0 0 0 #6dff9a00)}40%{opacity:1}to{opacity:1;transform:scale(1);filter:blur(0) brightness(1) drop-shadow(0 0 60px #6dff9acc)}}
#intro.go #iw{animation:iw 3s ease-out 4s both}
#intro.go{will-change:transform,opacity;animation:zo 2.1s cubic-bezier(.6,0,.95,.5) 7.8s forwards}
@keyframes zo{from{transform:scale(1);opacity:1}55%{opacity:.85}to{transform:scale(22);opacity:0}}
#intro.skip{animation:sk .7s cubic-bezier(.6,0,.95,.5) forwards}@keyframes sk{to{transform:scale(10);opacity:0}}
body.pl #intro::before{opacity:1}
.d:nth-child(1){--k:1}.d:nth-child(2){--k:2}.d:nth-child(3){--k:3}.d:nth-child(4){--k:4}
/* ===== always-visible names, grid layout ===== */
.t .n{opacity:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.25}
.t.gen .n{opacity:0}
#stage{top:0;height:100%;pointer-events:none;cursor:auto}
.t{pointer-events:auto;cursor:grab}
#hit{position:fixed;left:0;right:0;top:calc(50% - 150px);height:270px;z-index:1;touch-action:pan-y;cursor:grab}
body.gm #hit{top:var(--gt,128px);bottom:var(--gb,140px);height:auto;touch-action:none;cursor:default}
body.gm #stage{touch-action:none;-webkit-mask-image:linear-gradient(#0000 calc(var(--gt,128px) - 10px),#000 calc(var(--gt,128px) + 14px),#000 calc(100% - var(--gb,140px) - 14px),#0000 calc(100% - var(--gb,140px) + 10px));mask-image:linear-gradient(#0000 calc(var(--gt,128px) - 10px),#000 calc(var(--gt,128px) + 14px),#000 calc(100% - var(--gb,140px) - 14px),#0000 calc(100% - var(--gb,140px) + 10px))}
body.gm .t{touch-action:none;cursor:pointer}
body.gm #info{display:none}
#rowt{transition:left .45s cubic-bezier(.2,.9,.2,1),top .45s cubic-bezier(.2,.9,.2,1)}
body.gm #rowt{left:var(--gx,96px);top:78px}

/* ---------- auto-sync with github.com/bubbls/ugs-singlefile (UGS-Files): every game file there is added; ones already in the list are skipped ---------- */
const REPO_TREE='https://api.github.com/repos/bubbls/ugs-singlefile/git/trees/HEAD?recursive=1',REPO_DIR='UGS-Files/';
const DROP=["clbas.html", "clgrn.html", "cluzg.html", "clovofixed.html", "clpou.html", "clpolyold.html", "clsnowriderrrr.html", "clbrainrot.html", "clstealbrainrot.html", "cltagc3.html", "cltagcm.html", "clthedeadseat.html", "clangrybirdsonline.html"];
const baseFiles=new Set(games.map(g=>g.file.toLowerCase()).concat(DROP)),known=new Set(baseFiles);
S.bk=S.bk||{};
S.sy=S.sy||{t:0,f:[]};S.nm=S.nm||{};
const pretty=f=>{let s=f.replace(/\.html?$/i,'').replace(/^cl(?=[a-z0-9]{3})/,'').replace(/[-_.]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/([A-Za-z])(\d)/g,'$1 $2').replace(/\s+/g,' ').trim();return s.replace(/\b[a-z]/g,c=>c.toUpperCase())||f};
const catOf=f=>/eagler/i.test(f)?'Eaglercraft':/fnf|funkin/i.test(f)?'FNF':/flash|swf/i.test(f)?'Flash':'Games';
const letterOf=n=>{const f=(n.match(/[A-Za-z0-9]/)||['#'])[0].toUpperCase();return/[0-9]/.test(f)?'0-9':f};
function addGame(file){const k=file.toLowerCase();if(known.has(k))return null;known.add(k);const cat=catOf(file),n=S.nm[file],name=n&&typeof n==='string'?n:pretty(file),g={id:cat+'/'+file,name,file,cat,letter:letterOf(name),syn:1};games.push(g);if(n&&typeof n==='string')vet(g);return g}
function applySyncCache(){for(const f of S.sy.f)addGame(f)}
function tidyTitle(t,file){const d=document.createElement('textarea');d.innerHTML=t;let s=d.value.replace(/\s+/g,' ').trim();s=s.replace(/^unity (webgl )?player\s*[|\-–—:]\s*/i,'').replace(/^play\s+/i,'').replace(/\s*[|\-–—:]\s*(?=[^|\-–—:]*\b(play|unblocked|free|online|games?|poki|crazygames|coolmath|kongregate|newgrounds|miniclip|html5|webgl)\b).*$/i,'').replace(/\s+unblocked$/i,'').trim();
if(!s||s.length>60||/^(document|untitled|index|game|home|loading\.*|redirecting\.*|404.*|not found)$/i.test(s))return pretty(file);return s}
async function titleOf(file){for(const base of BASES){try{const r=await fetch(base+encodeURIComponent(file));if(!r.ok||!r.body)continue;const rd=r.body.getReader(),dec=new TextDecoder();let t='';while(t.length<40000){const x=await rd.read();if(x.done)break;t+=dec.decode(x.value,{stream:true});const m=t.match(/<title[^>]*>([\s\S]*?)<\/title>/i);if(m){rd.cancel().catch(()=>{});return m[1]}if(/<\/head>|<body/i.test(t))break}rd.cancel().catch(()=>{});return''}catch(e){}}return null}
/* ---------- vetting: junk names, repeats, blank pages ---------- */
const W3=new Set('egg tag uno dud xor cat dog car bus ant bee box run war bow ice fox pig sky sun ski zoo gem key map mud net ore pet pop sea spy tap toy web wow zip bat bit dot fly hop jam joy lab mix owl pin pit rat red rod saw tin top tub yes you zen age air all arc art ash bar bay bed big bin bog bud cap cop cow cub cup cut day den dig dim dip dry ear eat end eye fan far fat fin fit fix fog fun gap gas gun gym hat hit hot hub hug ink inn jet job jug kid kit lap law leg lid lip log low mad man mat men mop new nut oak oil old one out pad pan paw pay pea pen pie pot pub raw ray rim rip row rub sad sat set sew shy sin sit six spa sub tea ten tip toe tug two van war wet win wit yak yet zap'.split(' '));
const junkName=n=>{const a=n.replace(/[^A-Za-z0-9]/g,'');return a.length<=3&&/^[A-Za-z]+$/.test(a)&&!W3.has(a.toLowerCase())};
const dkey=n=>n.toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/\b(unblocked|online|the)\b/g,' ').replace(/[^a-z0-9]/g,'');
const seenK=new Map();for(const g of games)if(!seenK.has(dkey(g.name)))seenK.set(dkey(g.name),g);
function vet(g){if(!g.syn||g.hide)return;if(junkName(g.name)){g.hide=1;return}const k=dkey(g.name),f=seenK.get(k);if(k&&f&&f!==g)g.hide=1;else if(k)seenK.set(k,g)}
/* a game whose file is empty, or that just sends you to about:blank, is not a playable game */
const BLANKRE=/(?:(?:top|window|document)\.)?location(?:\.href)?\s*=\s*['"]about:blank['"]|location\.(?:replace|assign)\(\s*['"]about:blank|http-equiv\s*=\s*["']?refresh[^>]*about:blank/i;
function isBlank(t,done){if(BLANKRE.test(t))return true;if(!done)return false;const b=t.replace(/<!--[\s\S]*?-->/g,'').replace(/\s+/g,' ');if(b.length<420&&!/<(canvas|script[^>]+src|embed|object|video)\b/i.test(b)&&!/<iframe[^>]+src\s*=\s*["']https?:/i.test(b))return true;return false}
async function peek(file,max){for(const base of BASES){try{const r=await fetch(base+encodeURIComponent(file));if(!r.ok||!r.body)continue;const rd=r.body.getReader(),dec=new TextDecoder();let t='',done=false;while(t.length<max){const x=await rd.read();if(x.done){done=true;break}t+=dec.decode(x.value,{stream:true})}if(!done)rd.cancel().catch(()=>{});return{t,done}}catch(e){}}return null}
let scanB=0;
async function scanBlank(){if(scanB)return;scanB=1;try{const todo=games.filter(g=>S.bk[g.file]===undefined);let i=0,n=0,hit=0;toast('Checking '+todo.length+' games for blank pages…');
await Promise.all(Array.from({length:4},async()=>{while(1){const g=todo[i++];if(!g)break;const r=await peek(g.file,24000);if(!r)continue;const b=isBlank(r.t,r.done);S.bk[g.file]=b?1:0;if(b)hit++;if(++n%40===0){save();if(hit)syncRelist()}}}));save();syncRelist();toast(hit?('Removed '+hit+' blank game'+(hit===1?'':'s')):'No blank games found')}finally{scanB=0}}
let srT=0;function syncRelist(){if(srT)return;srT=setTimeout(function f(){srT=0;if(dragging||Date.now()-lastAct<1500||$('player').classList.contains('open')){srT=setTimeout(f,1500);return}relist();$('cnt').textContent=games.length+' games'},3000)}
let naming=0;
/* real names for the new files: read each file's <title> (first few KB only) and remember it */
async function nameNew(){if(naming)return;naming=1;try{const todo=games.filter(g=>g.syn&&(S.nm[g.file]===undefined||S.bk[g.file]===undefined));let i=0,n=0;
await Promise.all(Array.from({length:4},async()=>{while(1){const g=todo[i++];if(!g)break;const r=await peek(g.file,24000);if(!r)continue;
if(S.bk[g.file]===undefined)S.bk[g.file]=isBlank(r.t,r.done)?1:0;
if(S.nm[g.file]===undefined){const m=r.t.match(/<title[^>]*>([\s\S]*?)<\/title>/i),nm=m&&m[1].trim()?tidyTitle(m[1],g.file):pretty(g.file);S.nm[g.file]=nm===pretty(g.file)?0:nm;if(nm!==g.name){g.name=nm;g.letter=letterOf(nm)}if(S.nm[g.file])vet(g)}
if(++n%25===0){save();syncRelist()}}}));save();if(n)syncRelist()}finally{naming=0}}
async function listRepo(){const tries=[
async()=>{const r=await fetch(REPO_TREE);if(!r.ok)throw 0;const j=await r.json();if(!j.tree)throw 0;return j.tree.filter(x=>x.type==='blob').map(x=>x.path)},
async()=>{for(const v of['main','master']){try{const r=await fetch('https://data.jsdelivr.com/v1/packages/gh/bubbls/ugs-singlefile@'+v+'?structure=flat');if(!r.ok)continue;const j=await r.json();if(j.files)return j.files.map(x=>x.name.replace(/^\//,''))}catch(e){}}throw 0},
async()=>{const j=await viaPx(REPO_TREE);if(!j.tree)throw 0;return j.tree.filter(x=>x.type==='blob').map(x=>x.path)}];
for(const t of tries){try{const p=await t();const f=p.filter(x=>x.startsWith(REPO_DIR)).map(x=>x.slice(REPO_DIR.length)).filter(x=>x&&x.indexOf('/')<0&&/\.html?$/i.test(x)&&!/^index\.html?$/i.test(x));if(f.length)return f}catch(e){}}return null}
async function syncRemote(force){if(!force&&Date.now()-S.sy.t<18e5&&S.sy.f.length){nameNew();return 0}
const f=await listRepo();if(!f){if(force)toast('Couldn\'t reach the game repository. Try again in a bit.');nameNew();return 0}
const fresh=f.filter(x=>!baseFiles.has(x.toLowerCase()));S.sy={t:Date.now(),f:fresh};save();
let added=0;for(const x of fresh)if(addGame(x))added++;
if(added){$('cnt').textContent=games.length+' games';syncRelist();toast('Added '+added+' new game'+(added===1?'':'s')+' from the repository')}else if(force)toast('Already up to date. '+games.length+' games.');
nameNew();return added}
function layTools(box){box.append(seg([['row','Row'],['grid','Grid']],S.lay,k=>{sfx.tog();setLayout(k)}),el('div','hint','Row: the sliding carousel. Grid: every game laid out like the Xbox library, scrolling down. Switching slides the games into place.'))}
function libTools(box){const b=el('button','mini','Sync games now');b.onclick=async()=>{b.disabled=true;b.textContent='Syncing…';sfx.sel();try{await syncRemote(true)}finally{b.disabled=false;b.textContent='Sync games now'}};
const sb=el('button','mini','Scan for blank games');sb.style.marginTop='6px';sb.style.display='block';sb.onclick=()=>{sfx.sel();scanBlank()};
const rh=el('button','mini','Restore hidden games');rh.style.marginTop='6px';rh.style.display='block';rh.onclick=()=>{S.bk={};for(const g of games)if(g.syn)delete g.hide;seenK.clear();for(const g of games){if(g.syn)delete g.hide;const k=dkey(g.name);if(!seenK.has(k))seenK.set(k,g)}save();sfx.sel();syncRelist();toast('Blank-page results cleared. Scan again any time.')};
const rn=el('button','mini','Re-read game names');rn.style.marginTop='6px';rn.style.display='block';rn.onclick=()=>{for(const g of games)if(g.syn)delete S.nm[g.file];save();sfx.sel();nameNew();toast('Reading names of synced games…')};
box.append(b,sb,rh,rn,el('div','hint','Games that are empty or just send you to about:blank are hidden, as are repeats and junk names. Every game file in github.com/bubbls/ugs-singlefile (UGS-Files) is added automatically on load, and checked again every 30 minutes. Files already in your list are skipped.'))}
applySyncCache();
['click','pointerup'].forEach(t=>$('side').addEventListener(t,()=>{inSide=1;setTimeout(()=>{inSide=0},0)},true));
document.body.classList.toggle('gm',S.lay==='grid');geoVars();
applyName();applyPerf();buildNav();buildDock();buildSide();dockLabel();refresh();buildRec();$('cnt').textContent=games.length+' games';boot();syncRemote();
</script>
